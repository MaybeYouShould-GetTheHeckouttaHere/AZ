<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    canvas { display: block; }
    #connectScreen {
      text-align: center;
      color: #ffffff;
    }
    #connectScreen h1 {
      font-size: 80px;
      margin-bottom: 30px;
    }
    #connectScreen input {
      font-size: 20px;
      padding: 10px 16px;
      border: 2px solid #555;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
      outline: none;
      width: 220px;
      text-align: center;
    }
    #connectScreen input:focus { border-color: #88bb88; }
    #connectScreen button {
      display: block;
      margin: 20px auto 0;
      font-size: 18px;
      padding: 10px 32px;
      border: 2px solid #88bb88;
      border-radius: 6px;
      background: #446644;
      color: #fff;
      cursor: pointer;
    }
    #connectScreen button:hover { background: #557755; }
    #connectScreen .status {
      margin-top: 16px;
      font-size: 14px;
      color: #888;
    }
    #connectScreen .error {
      margin-top: 10px;
      font-size: 14px;
      color: #cc5555;
    }
  </style>
</head>
<body>
  <div id="connectScreen">
    <h1>AZ</h1>
    <input id="nameInput" type="text" maxlength="16" placeholder="Username" autofocus>
    <button id="connectBtn">Connect</button>
    <div class="status" id="connectStatus"></div>
    <div class="error" id="connectError"></div>
  </div>
  <canvas id="game" style="display:none;"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const connectScreen = document.getElementById('connectScreen');
    const nameInput = document.getElementById('nameInput');
    const connectBtn = document.getElementById('connectBtn');
    const connectStatus = document.getElementById('connectStatus');
    const connectError = document.getElementById('connectError');

    // --- Game state ---
    let ws = null;
    let myId = null;
    let myName = '';
    let colors = {};
    let names = {};
    let gamePhase = 'connect'; // 'connect', 'lobby', 'playing', 'roundEnd'
    let map = null;
    let cellSize = 0;
    let lobbyPlayers = []; // [{id, name, color, ready}]
    let readyCountdownEnd = null; // timestamp when ready countdown expires

    // --- Canvas sizing ---
    function resizeCanvas() {
      const size = Math.min(800, window.innerWidth - 20, window.innerHeight - 20);
      canvas.width = size;
      canvas.height = size;
      if (map) cellSize = size / map.rows;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    let players = [];
    let bullets = [];
    let gamePowerUps = [];
    let gameMissiles = [];
    let gameWirelessMissiles = [];
    let gameLandmines = [];
    let gameIceTraps = [];
    let winnerId = null;
    let scores = {};
    let rematchVotes = [];
    let countdownEnd = 0;

    // Button bounds (set during drawing)
    let readyBtn = { x: 0, y: 0, w: 0, h: 0 };
    let rematchBtn = { x: 0, y: 0, w: 0, h: 0 };

    // --- Color helpers ---
    function darkenColor(hex, factor) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgb(${Math.floor(r * factor)}, ${Math.floor(g * factor)}, ${Math.floor(b * factor)})`;
    }

    function lightenColor(hex, factor) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgb(${Math.min(255, Math.floor(r + (255 - r) * factor))}, ${Math.min(255, Math.floor(g + (255 - g) * factor))}, ${Math.min(255, Math.floor(b + (255 - b) * factor))})`;
    }

    // --- Connect ---
    function getPlayerName(id) {
      return names[id] || `P${id}`;
    }

    function returnToConnectScreen(message) {
      gamePhase = 'connect';
      myId = null;
      colors = {};
      names = {};
      lobbyPlayers = [];
      players = [];
      bullets = [];
      gamePowerUps = [];
      gameMissiles = [];
      gameWirelessMissiles = [];
      gameLandmines = [];
      gameIceTraps = [];
      map = null;
      scores = {};
      rematchVotes = [];
      readyCountdownEnd = null;
      ws = null;
      canvas.style.display = 'none';
      connectScreen.style.display = '';
      connectStatus.textContent = '';
      connectError.textContent = message || '';
      connectBtn.disabled = false;
      nameInput.value = myName;
    }

    function connect() {
      const name = nameInput.value.trim() || 'Player';
      myName = name;
      connectError.textContent = '';
      connectBtn.disabled = true;

      // If already connected (e.g. retrying after name taken), just re-send join
      if (ws && ws.readyState === 1) {
        connectStatus.textContent = 'Joining...';
        ws.send(JSON.stringify({ type: 'join', name }));
        return;
      }

      connectStatus.textContent = 'Connecting...';
      const host = window.location.host || 'localhost:55928';
      ws = new WebSocket(`ws://${host}`);

      // 7-second connection timeout
      const connectTimeout = setTimeout(() => {
        if (ws.readyState !== 1) {
          ws.close();
          connectStatus.textContent = '';
          connectError.textContent = 'Connection timed out.';
          connectBtn.disabled = false;
        }
      }, 7000);

      ws.addEventListener('open', () => {
        clearTimeout(connectTimeout);
        connectStatus.textContent = 'Connected, joining...';
        ws.send(JSON.stringify({ type: 'join', name }));
      });

      ws.addEventListener('close', () => {
        clearTimeout(connectTimeout);
        if (gamePhase !== 'connect') {
          // Was in-game, return to connect screen
          returnToConnectScreen('Connection lost.');
        } else {
          connectStatus.textContent = '';
          connectError.textContent = 'Connection lost.';
          connectBtn.disabled = false;
        }
      });

      ws.addEventListener('error', () => {
        clearTimeout(connectTimeout);
        connectStatus.textContent = '';
        connectError.textContent = 'Could not connect to server.';
        connectBtn.disabled = false;
      });

      ws.addEventListener('message', (event) => {
        const msg = JSON.parse(event.data);

        switch (msg.type) {
          case 'welcome':
            // Server info before join
            break;

          case 'error':
            connectError.textContent = msg.message;
            connectStatus.textContent = '';
            connectBtn.disabled = false;
            break;

          case 'init':
            myId = msg.playerId;
            colors = msg.colors;
            names = msg.names || {};
            // Switch to game canvas
            connectScreen.style.display = 'none';
            canvas.style.display = 'block';
            gamePhase = 'lobby';
            resizeCanvas();
            break;

          case 'lobby':
            lobbyPlayers = msg.players;
            // Rebuild colors/names from lobby data (clears stale entries)
            colors = {};
            names = {};
            for (const p of msg.players) {
              colors[p.id] = p.color;
              names[p.id] = p.name;
            }
            if (gamePhase === 'roundEnd' || gamePhase === 'playing') {
              // returning to lobby after round — reset scores
              scores = {};
            }
            if (gamePhase !== 'playing') {
              gamePhase = 'lobby';
            }
            break;

          case 'readyCountdown':
            readyCountdownEnd = msg.endsAt;
            break;

          case 'newRound':
            gamePhase = 'playing';
            map = msg.map;
            cellSize = canvas.width / map.rows;
            readyCountdownEnd = null;
            if (msg.spawns) {
              players = msg.spawns.map(s => ({
                id: s.id, name: s.name || names[s.id], x: s.x, y: s.y, angle: s.angle,
                hp: 3, alive: true, color: s.color
              }));
              bullets = [];
              gamePowerUps = [];
              gameMissiles = [];
              gameLandmines = [];
              gameIceTraps = [];
              particles = [];
            }
            break;

          case 'state':
            players = msg.players;
            // Update names from state
            for (const p of msg.players) {
              if (p.name) names[p.id] = p.name;
            }
            bullets = msg.bullets;
            gamePowerUps = msg.powerUps || [];
            gameLandmines = msg.landmines || [];
            gameIceTraps = msg.iceTraps || [];
            // Spawn smoke trail particles for missiles
            if (msg.missiles) {
              for (const m of msg.missiles) {
                const targetColor = m.targetId != null ? (colors[m.targetId] || '#888') : '#888';
                spawnMissileSmoke(m.x, m.y, m.angle, targetColor);
              }
            }
            gameMissiles = msg.missiles || [];
            if (msg.wirelessMissiles) {
              for (const wm of msg.wirelessMissiles) {
                spawnMissileSmoke(wm.x, wm.y, wm.angle, wm.color);
              }
            }
            gameWirelessMissiles = msg.wirelessMissiles || [];
            if (msg.hits) {
              for (const hit of msg.hits) {
                spawnParticles(hit.x, hit.y);
              }
            }
            if (msg.deaths) {
              for (const d of msg.deaths) {
                spawnDeathExplosion(d.x, d.y, d.color);
                startScreenShake(0.25, 4);
              }
            }
            break;

          case 'roundEnd':
            gamePhase = 'roundEnd';
            winnerId = msg.winnerId;
            scores = msg.scores;
            countdownEnd = Date.now() + 5000;
            rematchVotes = [];
            break;

          case 'rematch':
            rematchVotes = msg.votes;
            break;

          case 'serverKill':
            returnToConnectScreen(msg.reason || 'Server disconnected.');
            break;
        }
      });
    }

    connectBtn.addEventListener('click', connect);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connect();
    });

    // --- Input handling ---
    const keys = { w: false, a: false, s: false, d: false, space: false };
    let lastSentKeys = null;

    const keyMap = {
      'KeyW': 'w', 'KeyA': 'a', 'KeyS': 's', 'KeyD': 'd', 'Space': 'space',
      'ArrowUp': 'w', 'ArrowLeft': 'a', 'ArrowDown': 's', 'ArrowRight': 'd'
    };

    window.addEventListener('keydown', (e) => {
      if (gamePhase === 'connect') return;
      if (gamePhase === 'lobby' && e.code === 'Space') {
        e.preventDefault();
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'ready' }));
        return;
      }
      const key = keyMap[e.code];
      if (key) {
        e.preventDefault();
        keys[key] = true;
        sendInput();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (gamePhase === 'connect') return;
      const key = keyMap[e.code];
      if (key) {
        e.preventDefault();
        keys[key] = false;
        sendInput();
      }
    });

    function sendInput() {
      const json = JSON.stringify(keys);
      if (json !== lastSentKeys && ws && ws.readyState === 1) {
        lastSentKeys = json;
        ws.send(JSON.stringify({ type: 'input', keys }));
      }
    }

    // --- Canvas click handler ---
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      if (gamePhase === 'lobby') {
        // Ready button
        if (x >= readyBtn.x && x <= readyBtn.x + readyBtn.w &&
            y >= readyBtn.y && y <= readyBtn.y + readyBtn.h) {
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: 'ready' }));
          }
        }
      } else if (gamePhase === 'roundEnd') {
        // Rematch button
        if (x >= rematchBtn.x && x <= rematchBtn.x + rematchBtn.w &&
            y >= rematchBtn.y && y <= rematchBtn.y + rematchBtn.h) {
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: 'rematch' }));
          }
        }
      }
    });

    // --- Click to fire ---
    canvas.addEventListener('mousedown', (e) => {
      if (gamePhase !== 'playing' || e.button !== 0) return;
      keys.space = true;
      sendInput();
    });
    canvas.addEventListener('mouseup', (e) => {
      if (e.button !== 0) return;
      keys.space = false;
      sendInput();
    });

    // --- Drawing helpers ---
    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    // --- Drawing: Map ---
    function drawMap() {
      ctx.fillStyle = '#C0C0C0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!map) return;

      ctx.strokeStyle = '#4A4A4A';
      ctx.lineWidth = Math.max(4, cellSize * 0.08);
      ctx.lineCap = 'square';

      // Horizontal walls
      for (let row = 0; row < map.hWalls.length; row++) {
        for (let col = 0; col < map.hWalls[row].length; col++) {
          if (map.hWalls[row][col]) {
            ctx.beginPath();
            ctx.moveTo(col * cellSize, row * cellSize);
            ctx.lineTo((col + 1) * cellSize, row * cellSize);
            ctx.stroke();
          }
        }
      }

      // Vertical walls
      for (let row = 0; row < map.vWalls.length; row++) {
        for (let col = 0; col < map.vWalls[row].length; col++) {
          if (map.vWalls[row][col]) {
            ctx.beginPath();
            ctx.moveTo(col * cellSize, row * cellSize);
            ctx.lineTo(col * cellSize, (row + 1) * cellSize);
            ctx.stroke();
          }
        }
      }
    }

    // --- Drawing: Tank ---
    function drawTank(player) {
      const px = player.x * cellSize;
      const py = player.y * cellSize;
      const bodyW = 0.32 * cellSize;
      const bodyL = 0.42 * cellSize;
      const color = player.color || colors[player.id] || '#888888';

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(player.angle + Math.PI / 2);

      if (!player.alive) {
        ctx.globalAlpha = 0.35;
      }

      // Body
      ctx.fillStyle = color;
      ctx.fillRect(-bodyW / 2, -bodyL / 2, bodyW, bodyL);

      // Outline
      ctx.strokeStyle = darkenColor(color, 0.5);
      ctx.lineWidth = 2;
      ctx.strokeRect(-bodyW / 2, -bodyL / 2, bodyW, bodyL);

      // Barrel (turret)
      const barrelW = 0.1 * cellSize;
      const barrelL = 0.3 * cellSize;
      ctx.fillStyle = darkenColor(color, 0.7);
      ctx.strokeStyle = darkenColor(color, 0.5);
      ctx.lineWidth = 1;

      if (player.powerUp === 'missile' || player.powerUp === 'wirelessMissile') {
        // Missile / wireless missile barrel: rectangular body + triangle warhead tip
        ctx.fillRect(-barrelW / 2, -barrelL * 0.65, barrelW, barrelL * 0.65);
        ctx.strokeRect(-barrelW / 2, -barrelL * 0.65, barrelW, barrelL * 0.65);
        const tipW = barrelW * 1.6;
        const tipColor = player.powerUp === 'wirelessMissile' ? '#111' : '#e74c3c';
        const tipStroke = player.powerUp === 'wirelessMissile' ? '#000' : '#c0392b';
        ctx.fillStyle = tipColor;
        ctx.beginPath();
        ctx.moveTo(0, -barrelL - barrelW * 0.3);
        ctx.lineTo(-tipW / 2, -barrelL * 0.65);
        ctx.lineTo(tipW / 2, -barrelL * 0.65);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = tipStroke;
        ctx.stroke();
      } else if (player.powerUp === 'landmine') {
        // Landmine barrel: short barrel + circle with button on top
        ctx.fillRect(-barrelW / 2, -barrelL * 0.4, barrelW, barrelL * 0.4);
        ctx.strokeRect(-barrelW / 2, -barrelL * 0.4, barrelW, barrelL * 0.4);
        const mineR = barrelW * 0.9;
        ctx.fillStyle = '#555';
        ctx.beginPath();
        ctx.arc(0, -barrelL * 0.4 - mineR, mineR, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.stroke();
        // Button on top
        ctx.fillStyle = '#cc3333';
        ctx.beginPath();
        ctx.arc(0, -barrelL * 0.4 - mineR - mineR * 0.3, mineR * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (player.powerUp === 'ice') {
        // Ice barrel: short barrel + ice crystal
        ctx.fillRect(-barrelW / 2, -barrelL * 0.4, barrelW, barrelL * 0.4);
        ctx.strokeRect(-barrelW / 2, -barrelL * 0.4, barrelW, barrelL * 0.4);
        const iceS = barrelW * 0.8;
        const iceY = -barrelL * 0.4 - iceS * 1.2;
        ctx.fillStyle = 'rgba(135, 206, 250, 0.8)';
        ctx.strokeStyle = '#4a9bd9';
        ctx.fillRect(-iceS, iceY - iceS, iceS * 2, iceS * 2);
        ctx.strokeRect(-iceS, iceY - iceS, iceS * 2, iceS * 2);
      } else {
        // Normal barrel
        ctx.fillRect(-barrelW / 2, -barrelL, barrelW, barrelL);
        ctx.strokeRect(-barrelW / 2, -barrelL, barrelW, barrelL);
      }

      ctx.globalAlpha = 1;
      ctx.restore();

      // Player label (not rotated) — show name
      const label = getPlayerName(player.id);
      ctx.save();
      ctx.font = `bold ${Math.max(10, cellSize * 0.22)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillText(label, px + 1, py - bodyL / 2 - 3 + 1);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(label, px, py - bodyL / 2 - 3);
      ctx.restore();
    }

    // --- Drawing: Bullet ---
    const BULLET_COLOR = '#4A4A4A';
    const BULLET_GLOW = '#6A6A6A';

    function drawBullet(bullet) {
      const bx = bullet.x * cellSize;
      const by = bullet.y * cellSize;
      const r = 0.075 * cellSize;

      ctx.beginPath();
      ctx.arc(bx, by, r * 1.8, 0, Math.PI * 2);
      ctx.fillStyle = BULLET_GLOW;
      ctx.globalAlpha = 0.3;
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.beginPath();
      ctx.arc(bx, by, r, 0, Math.PI * 2);
      ctx.fillStyle = BULLET_COLOR;
      ctx.fill();
    }

    // --- Particle System ---
    let particles = [];

    function spawnParticles(x, y) {
      const count = 6 + Math.floor(Math.random() * 4);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.3 + Math.random() * 0.8;
        particles.push({
          x, y,
          dx: Math.cos(angle) * speed,
          dy: Math.sin(angle) * speed,
          life: 0.3 + Math.random() * 0.3,
          maxLife: 0.3 + Math.random() * 0.3,
          size: 0.03 + Math.random() * 0.04,
        });
      }
    }

    function updateAndDrawParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.dx * dt;
        p.y += p.dy * dt;
        p.life -= dt;
        p.dx *= 0.96;
        p.dy *= 0.96;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        const maxA = p.maxAlpha || 0.4;
        const alpha = (p.life / p.maxLife) * maxA;
        const px = p.x * cellSize;
        const py = p.y * cellSize;
        const r = p.size * cellSize;

        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color || '#4A4A4A';
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // --- Death Explosion (shrapnel) ---
    function spawnDeathExplosion(x, y, color) {
      // Larger, more numerous particles in the tank's color
      const count = 14 + Math.floor(Math.random() * 6); // 14-19 pieces
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.8 + Math.random() * 1.8; // faster than bullet particles
        const life = 0.5 + Math.random() * 0.5;
        particles.push({
          x, y,
          dx: Math.cos(angle) * speed,
          dy: Math.sin(angle) * speed,
          life,
          maxLife: life,
          size: 0.04 + Math.random() * 0.06, // larger chunks
          color, // tank color for shrapnel
          maxAlpha: 0.5, // high transparency
        });
      }
      // A few darker core pieces
      for (let i = 0; i < 5; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.3 + Math.random() * 0.6;
        const life = 0.6 + Math.random() * 0.4;
        particles.push({
          x, y,
          dx: Math.cos(angle) * speed,
          dy: Math.sin(angle) * speed,
          life,
          maxLife: life,
          size: 0.05 + Math.random() * 0.05,
          color: '#4A4A4A',
          maxAlpha: 0.35,
        });
      }
    }

    // --- Missile smoke trail ---
    function spawnMissileSmoke(x, y, angle, color) {
      // Spawn 1-2 smoke particles behind the missile
      for (let i = 0; i < 2; i++) {
        const backAngle = angle + Math.PI + (Math.random() - 0.5) * 0.8;
        const speed = 0.2 + Math.random() * 0.4;
        const life = 0.3 + Math.random() * 0.3;
        particles.push({
          x: x - Math.cos(angle) * 0.1,
          y: y - Math.sin(angle) * 0.1,
          dx: Math.cos(backAngle) * speed,
          dy: Math.sin(backAngle) * speed,
          life,
          maxLife: life,
          size: 0.04 + Math.random() * 0.04,
          color,
          maxAlpha: 0.4,
        });
      }
    }

    // --- Drawing: Power-up ---
    function drawPowerUp(pu) {
      const px = pu.x * cellSize;
      const py = pu.y * cellSize;
      const size = cellSize * 0.3;

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(pu.angle);

      // White outlined block
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.strokeStyle = '#cccccc';
      ctx.lineWidth = 2;
      ctx.fillRect(-size / 2, -size / 2, size, size);
      ctx.strokeRect(-size / 2, -size / 2, size, size);

      // Icon per type
      const s = size * 0.35;
      ctx.lineWidth = 1;

      if (pu.type === 'missile') {
        ctx.fillStyle = '#e74c3c';
        ctx.strokeStyle = '#c0392b';
        ctx.beginPath();
        ctx.moveTo(0, -s);
        ctx.lineTo(s * 0.35, -s * 0.3);
        ctx.lineTo(s * 0.35, s * 0.5);
        ctx.lineTo(s * 0.6, s * 0.8);
        ctx.lineTo(s * 0.35, s * 0.6);
        ctx.lineTo(-s * 0.35, s * 0.6);
        ctx.lineTo(-s * 0.6, s * 0.8);
        ctx.lineTo(-s * 0.35, s * 0.5);
        ctx.lineTo(-s * 0.35, -s * 0.3);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (pu.type === 'landmine') {
        // Circle with spikes
        ctx.fillStyle = '#555';
        ctx.strokeStyle = '#333';
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // Spikes
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1.5;
        for (let a = 0; a < 6; a++) {
          const ang = a * Math.PI / 3;
          ctx.beginPath();
          ctx.moveTo(Math.cos(ang) * s * 0.5, Math.sin(ang) * s * 0.5);
          ctx.lineTo(Math.cos(ang) * s * 0.85, Math.sin(ang) * s * 0.85);
          ctx.stroke();
        }
        // Red button
        ctx.fillStyle = '#cc3333';
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.25, 0, Math.PI * 2);
        ctx.fill();
      } else if (pu.type === 'ice') {
        // Ice cube
        const cs = s * 0.7;
        ctx.fillStyle = 'rgba(135, 206, 250, 0.8)';
        ctx.strokeStyle = '#4a9bd9';
        ctx.lineWidth = 1.5;
        ctx.fillRect(-cs, -cs, cs * 2, cs * 2);
        ctx.strokeRect(-cs, -cs, cs * 2, cs * 2);
        // Shine line
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-cs * 0.5, -cs * 0.7);
        ctx.lineTo(-cs * 0.5, cs * 0.3);
        ctx.stroke();
      } else if (pu.type === 'wirelessMissile') {
        // WiFi icon: dot + 3 arcs fanning upward
        ctx.fillStyle = '#2255cc';
        ctx.strokeStyle = '#2255cc';
        ctx.lineCap = 'round';
        ctx.lineWidth = 1.5;
        const dotY = s * 0.65;
        // Dot
        ctx.beginPath();
        ctx.arc(0, dotY, s * 0.14, 0, Math.PI * 2);
        ctx.fill();
        // Three arcs, each centered at dot, sweeping 135° upward
        const arcStart = Math.PI * 1.175;
        const arcEnd   = Math.PI * 1.825;
        for (let ai = 0; ai < 3; ai++) {
          const r = s * (0.28 + ai * 0.3);
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(0, dotY, r, arcStart, arcEnd);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    // --- Drawing: Landmine ---
    function drawLandmine(lm) {
      const px = lm.x * cellSize;
      const py = lm.y * cellSize;
      const r = cellSize * 0.15;

      ctx.save();
      ctx.globalAlpha = lm.alpha ?? 1;
      ctx.translate(px, py);

      // Outer circle
      ctx.fillStyle = lm.armed ? '#6b3030' : '#555';
      ctx.strokeStyle = lm.armed ? '#993333' : '#444';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Spikes (only when armed)
      if (lm.armed) {
        ctx.strokeStyle = '#993333';
        ctx.lineWidth = 1;
        for (let a = 0; a < 8; a++) {
          const ang = a * Math.PI / 4;
          ctx.beginPath();
          ctx.moveTo(Math.cos(ang) * r * 0.8, Math.sin(ang) * r * 0.8);
          ctx.lineTo(Math.cos(ang) * r * 1.3, Math.sin(ang) * r * 1.3);
          ctx.stroke();
        }
      }

      // Button
      ctx.fillStyle = lm.armed ? '#ff4444' : '#888';
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // --- Drawing: Ice Trap ---
    function drawIceTrap(it) {
      const px = it.x * cellSize;
      const py = it.y * cellSize;
      const s = cellSize * 0.18;

      ctx.save();
      ctx.globalAlpha = (it.alpha ?? 1) * 0.85;
      ctx.fillStyle = it.armed ? 'rgba(135, 206, 250, 0.6)' : 'rgba(200, 230, 255, 0.5)';
      ctx.strokeStyle = it.armed ? '#4a9bd9' : '#aad4f0';
      ctx.lineWidth = 1.5;
      ctx.fillRect(px - s, py - s, s * 2, s * 2);
      ctx.strokeRect(px - s, py - s, s * 2, s * 2);
      // Shine
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px - s * 0.4, py - s * 0.7);
      ctx.lineTo(px - s * 0.4, py + s * 0.3);
      ctx.stroke();
      ctx.restore();
    }

    // --- Drawing: Missile ---
    function drawMissile(m) {
      const px = m.x * cellSize;
      const py = m.y * cellSize;
      const ownerColor = colors[m.ownerId] || '#888';
      const size = cellSize * 0.12;

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(m.angle + Math.PI / 2);

      // Body
      ctx.fillStyle = darkenColor(ownerColor, 0.8);
      ctx.strokeStyle = darkenColor(ownerColor, 0.5);
      ctx.lineWidth = 1.5;

      ctx.beginPath();
      // Nose (top)
      ctx.moveTo(0, -size * 1.5);
      ctx.lineTo(size * 0.5, -size * 0.3);
      ctx.lineTo(size * 0.5, size * 0.8);
      // Fin right
      ctx.lineTo(size * 0.9, size * 1.3);
      ctx.lineTo(size * 0.5, size);
      // Bottom
      ctx.lineTo(-size * 0.5, size);
      // Fin left
      ctx.lineTo(-size * 0.9, size * 1.3);
      ctx.lineTo(-size * 0.5, size * 0.8);
      ctx.lineTo(-size * 0.5, -size * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Engine glow
      ctx.fillStyle = '#ff6600';
      ctx.globalAlpha = 0.6 + Math.random() * 0.4;
      ctx.beginPath();
      ctx.arc(0, size * 1.1, size * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    // --- Drawing: Wireless Missile ---
    function drawWirelessMissile(wm) {
      const px = wm.x * cellSize;
      const py = wm.y * cellSize;
      const color = wm.color || '#888';
      const size = cellSize * 0.12;

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(wm.angle + Math.PI / 2);

      // Body — uses owner color
      ctx.fillStyle = color;
      ctx.strokeStyle = darkenColor(color, 0.5);
      ctx.lineWidth = 1.5;

      ctx.beginPath();
      ctx.moveTo(0, -size * 1.5);
      ctx.lineTo(size * 0.5, -size * 0.3);
      ctx.lineTo(size * 0.5, size * 0.8);
      ctx.lineTo(size * 0.9, size * 1.3);
      ctx.lineTo(size * 0.5, size);
      ctx.lineTo(-size * 0.5, size);
      ctx.lineTo(-size * 0.9, size * 1.3);
      ctx.lineTo(-size * 0.5, size * 0.8);
      ctx.lineTo(-size * 0.5, -size * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Black tip (warhead)
      ctx.fillStyle = '#111';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      const tipW = size * 0.5 * 1.6;
      ctx.beginPath();
      ctx.moveTo(0, -size * 1.5);
      ctx.lineTo(-tipW / 2, -size * 0.3);
      ctx.lineTo(tipW / 2, -size * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Engine glow
      ctx.fillStyle = '#ff6600';
      ctx.globalAlpha = 0.6 + Math.random() * 0.4;
      ctx.beginPath();
      ctx.arc(0, size * 1.1, size * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.restore();
    }

    // --- Drawing: Wireless Missile BFS Paths ---
    let _wmPathsLogTimer = 0;
    function drawWmPaths() {
      const myWm = gameWirelessMissiles.find(wm => wm.ownerId === myId);
      _wmPathsLogTimer++;
      if (_wmPathsLogTimer % 60 === 0) {
        console.log('[wmPaths] myId:', myId, 'wms:', gameWirelessMissiles.length, 'myWm:', myWm ? {ownerId: myWm.ownerId, paths: myWm.paths} : null);
      }
      if (!myWm || !myWm.paths || myWm.paths.length === 0) return;
      ctx.save();
      ctx.lineWidth = cellSize * 0.1;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.globalAlpha = 0.5;
      for (const path of myWm.paths) {
        if (!path.cells || path.cells.length < 2) continue;
        ctx.strokeStyle = path.color;
        ctx.beginPath();
        const [c0, r0] = path.cells[0];
        ctx.moveTo((c0 + 0.5) * cellSize, (r0 + 0.5) * cellSize);
        for (let i = 1; i < path.cells.length; i++) {
          const [c, r] = path.cells[i];
          ctx.lineTo((c + 0.5) * cellSize, (r + 0.5) * cellSize);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // --- Player Indicator Arrow ---
    function drawPlayerIndicator(me) {
      if (!me || !me.alive) return;
      const color = me.color || colors[me.id] || '#888';
      const px = me.x * cellSize;
      const py = me.y * cellSize;
      // Scale relative to canvas so it stays visible on huge maps
      const minSize = Math.max(canvas.width * 0.025, cellSize * 0.5);
      const arrowH = minSize;
      const arrowW = minSize * 1.2;
      const gap = cellSize * 0.4 + arrowH * 0.3; // distance above tank center
      const tipY = py - gap;
      const baseY = tipY - arrowH;

      // Check if arrow overlaps any object or HUD element
      const arrowRect = { x: px - arrowW, y: baseY - 2, w: arrowW * 2, h: arrowH + 4 };
      let obscured = false;

      // Check other players
      for (const p of players) {
        if (p.id === me.id || !p.alive) continue;
        const ox = p.x * cellSize;
        const oy = p.y * cellSize;
        const margin = cellSize * 0.25;
        if (ox + margin >= arrowRect.x && ox - margin <= arrowRect.x + arrowRect.w &&
            oy + margin >= arrowRect.y && oy - margin <= arrowRect.y + arrowRect.h) {
          obscured = true; break;
        }
      }
      // Check power-ups
      if (!obscured) {
        for (const pu of gamePowerUps) {
          const ox = pu.x * cellSize;
          const oy = pu.y * cellSize;
          const margin = cellSize * 0.3;
          if (ox + margin >= arrowRect.x && ox - margin <= arrowRect.x + arrowRect.w &&
              oy + margin >= arrowRect.y && oy - margin <= arrowRect.y + arrowRect.h) {
            obscured = true; break;
          }
        }
      }
      // Check missiles
      if (!obscured) {
        for (const m of gameMissiles) {
          const ox = m.x * cellSize;
          const oy = m.y * cellSize;
          const margin = cellSize * 0.15;
          if (ox + margin >= arrowRect.x && ox - margin <= arrowRect.x + arrowRect.w &&
              oy + margin >= arrowRect.y && oy - margin <= arrowRect.y + arrowRect.h) {
            obscured = true; break;
          }
        }
      }
      // Check HUD regions (health top-left, score top-right) — use pixel coords
      if (!obscured) {
        const rowH = 25;
        const hudH = players.length * rowH + 4;
        const hudW = canvas.width * 0.35;
        if (px < hudW && tipY < hudH) obscured = true;
        if (px > canvas.width - hudW && tipY < hudH) obscured = true;
      }

      ctx.save();
      ctx.globalAlpha = obscured ? 0.2 : 0.7;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(px, tipY);
      ctx.lineTo(px - arrowW / 2, baseY);
      ctx.lineTo(px + arrowW / 2, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // --- Screen Shake ---
    let shakeTimeLeft = 0;
    let shakeIntensity = 0;

    function startScreenShake(duration, intensity) {
      shakeTimeLeft = duration;
      shakeIntensity = intensity;
    }

    function getShakeOffset() {
      if (shakeTimeLeft <= 0) return { x: 0, y: 0 };
      const progress = shakeTimeLeft / 0.25; // fade out
      const mag = shakeIntensity * Math.min(1, progress);
      return {
        x: (Math.random() - 0.5) * 2 * mag,
        y: (Math.random() - 0.5) * 2 * mag,
      };
    }

    // --- Drawing: HUD ---
    function truncateName(name, max) {
      if (name.length <= max) return name;
      return name.slice(0, max - 1) + '\u2026';
    }

    function tankInRect(rx, ry, rw, rh) {
      // Check if any alive tank's pixel center falls within the rectangle (with some margin)
      const margin = cellSize * 0.3;
      for (const p of players) {
        if (!p.alive) continue;
        const px = p.x * cellSize;
        const py = p.y * cellSize;
        if (px + margin >= rx && px - margin <= rx + rw &&
            py + margin >= ry && py - margin <= ry + rh) {
          return true;
        }
      }
      return false;
    }

    function drawHUD() {
      const padding = 10;
      const rowH = 25;
      const fontSize = Math.max(11, Math.min(14, canvas.width * 0.018));
      ctx.font = `bold ${fontSize}px sans-serif`;

      const sorted = [...players].sort((a, b) => a.id - b.id);
      const FADE_ALPHA = 0.3;

      // --- Compute uniform pip offset for health display ---
      // Find the widest truncated name (max 20 chars)
      let maxNameWidth = 0;
      const displayNames = {};
      for (const p of sorted) {
        const dn = truncateName(getPlayerName(p.id), 20);
        displayNames[p.id] = dn;
        const w = ctx.measureText(dn).width;
        if (w > maxNameWidth) maxNameWidth = w;
      }
      // swatch(10) + gap(5) + maxNameWidth + gap(8) = pip start offset from padding
      const pipStartX = padding + 10 + 5 + maxNameWidth + 8;

      // --- Health display bounding box (for fade check) ---
      const healthW = pipStartX - padding + 3 * 16 + 10;
      const healthH = sorted.length * rowH + 4;
      const healthFade = tankInRect(0, 0, healthW, healthH);

      ctx.save();
      if (healthFade) ctx.globalAlpha = FADE_ALPHA;

      for (let i = 0; i < sorted.length; i++) {
        const p = sorted[i];
        const y = padding + i * rowH + 12;
        const color = p.color || colors[p.id] || '#888';

        // Color swatch
        ctx.fillStyle = color;
        ctx.fillRect(padding, y - 8, 10, 10);
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.strokeRect(padding, y - 8, 10, 10);

        // Name
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 2;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(displayNames[p.id], padding + 15, y - 3);

        // Health pips (uniform start position)
        const hp = p.hp != null ? p.hp : 0;
        for (let h = 0; h < 3; h++) {
          const pipX = pipStartX + h * 16;
          const pipY = y - 3;
          ctx.beginPath();
          ctx.arc(pipX, pipY, 5, 0, Math.PI * 2);
          ctx.fillStyle = h < hp ? color : '#555555';
          ctx.fill();
          ctx.strokeStyle = '#333';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
      }
      ctx.restore();

      // --- Score display (top-right) ---
      // Compute uniform layout: "Name   N" with consistent column alignment
      // Find widest score number and widest name
      let maxScoreW = 0;
      const scoreEntries = [];
      for (const p of sorted) {
        const dn = displayNames[p.id];
        const wins = scores[p.id] || 0;
        const scoreStr = String(wins);
        const sw = ctx.measureText(scoreStr).width;
        if (sw > maxScoreW) maxScoreW = sw;
        scoreEntries.push({ p, dn, wins, scoreStr });
      }
      // Score column: right-aligned at canvas.width - padding
      // Name column: right-aligned at canvas.width - padding - maxScoreW - gap
      const scoreGap = 10;
      const nameEndX = canvas.width - padding - maxScoreW - scoreGap;

      // Score bounding box (for fade check)
      const headerRow = padding + 12;
      let maxScoreNameW = ctx.measureText('Scores').width;
      for (const e of scoreEntries) {
        const w = ctx.measureText(e.dn).width + scoreGap + ctx.measureText(e.scoreStr).width;
        if (w > maxScoreNameW) maxScoreNameW = w;
      }
      const scoreBoxW = maxScoreNameW + padding + 10;
      const scoreBoxH = (sorted.length + 1) * rowH + 4;
      const scoreFade = tankInRect(canvas.width - scoreBoxW, 0, scoreBoxW, scoreBoxH);

      ctx.save();
      if (scoreFade) ctx.globalAlpha = FADE_ALPHA;

      ctx.textAlign = 'right';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 2;
      ctx.fillText('Scores', canvas.width - padding, headerRow);
      ctx.shadowBlur = 0;

      for (let i = 0; i < scoreEntries.length; i++) {
        const { p, dn, wins, scoreStr } = scoreEntries[i];
        const y = padding + (i + 1) * rowH + 12;
        const color = p.color || colors[p.id] || '#888';

        ctx.fillStyle = color;
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 2;
        // Score number (right-aligned at right edge)
        ctx.textAlign = 'right';
        ctx.fillText(scoreStr, canvas.width - padding, y);
        // Name (right-aligned to the left of score column)
        ctx.fillText(dn, nameEndX, y);
        ctx.shadowBlur = 0;
      }
      ctx.restore();
    }

    // --- Drawing: Lobby ---
    function drawLobby() {
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      let y = canvas.height * 0.15;

      // Title
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${canvas.width * 0.12}px sans-serif`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText('AZ', cx, y);

      // Player count
      y += canvas.width * 0.1;
      ctx.font = `bold ${canvas.width * 0.03}px sans-serif`;
      ctx.fillStyle = '#aaaaaa';
      ctx.fillText(`Players: ${lobbyPlayers.length}`, cx, y);

      // Player list
      y += canvas.width * 0.05;
      ctx.font = `${canvas.width * 0.025}px sans-serif`;
      for (const p of lobbyPlayers) {
        // Swatch
        ctx.fillStyle = p.color;
        ctx.fillRect(cx - 100, y - 7, 14, 14);
        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1;
        ctx.strokeRect(cx - 100, y - 7, 14, 14);
        // Name
        ctx.fillStyle = '#cccccc';
        ctx.textAlign = 'left';
        ctx.fillText(p.name, cx - 80, y);
        // Ready status
        ctx.textAlign = 'right';
        if (p.ready) {
          ctx.fillStyle = '#55cc55';
          ctx.fillText('Ready', cx + 100, y);
        } else {
          ctx.fillStyle = '#666666';
          ctx.fillText('Not Ready', cx + 100, y);
        }
        ctx.textAlign = 'center';
        y += canvas.width * 0.04;
      }

      // Ready button
      y += canvas.width * 0.02;
      const btnW = canvas.width * 0.3;
      const btnH = canvas.width * 0.06;
      const btnX = cx - btnW / 2;
      const btnY = y;
      readyBtn = { x: btnX, y: btnY, w: btnW, h: btnH };

      const myLobby = lobbyPlayers.find(p => p.id === myId);
      const amReady = myLobby && myLobby.ready;

      ctx.fillStyle = amReady ? '#335533' : '#446644';
      ctx.strokeStyle = amReady ? '#55cc55' : '#88bb88';
      ctx.lineWidth = 2;
      drawRoundedRect(btnX, btnY, btnW, btnH, 6);
      ctx.fill();
      ctx.stroke();

      ctx.font = `bold ${canvas.width * 0.025}px sans-serif`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(amReady ? 'Ready!' : 'Ready Up', cx, btnY + btnH / 2);

      // Countdown
      if (readyCountdownEnd) {
        const remaining = Math.max(0, Math.ceil((readyCountdownEnd - Date.now()) / 1000));
        y = btnY + btnH + canvas.width * 0.04;
        ctx.font = `bold ${canvas.width * 0.03}px sans-serif`;
        ctx.fillStyle = '#ffcc44';
        ctx.fillText(`Starting in ${remaining}...`, cx, y);
      }

      // Connection status
      y = canvas.height * 0.9;
      ctx.font = `${canvas.width * 0.02}px sans-serif`;
      if (ws && ws.readyState === 1) {
        ctx.fillStyle = '#55cc55';
        ctx.fillText('Connected', cx, y);
      } else {
        ctx.fillStyle = '#cc5555';
        ctx.fillText('Disconnected', cx, y);
      }
    }

    // --- Drawing: Score overlay ---
    function drawScoreOverlay() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      let y = canvas.height * 0.3;

      // Winner text
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${canvas.width * 0.07}px sans-serif`;
      ctx.shadowColor = 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = 6;
      ctx.fillStyle = '#ffffff';
      if (winnerId != null) {
        ctx.fillText(`${getPlayerName(winnerId)} wins!`, cx, y);
      } else {
        ctx.fillText('Tie!', cx, y);
      }
      ctx.shadowBlur = 0;

      // Countdown
      y += canvas.width * 0.08;
      const remaining = Math.max(0, Math.ceil((countdownEnd - Date.now()) / 1000));
      ctx.font = `${canvas.width * 0.035}px sans-serif`;
      ctx.fillStyle = '#cccccc';
      ctx.fillText(`Next round in ${remaining}...`, cx, y);

      // Scores
      y += canvas.width * 0.07;
      ctx.font = `bold ${canvas.width * 0.03}px sans-serif`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Scores', cx, y);

      y += canvas.width * 0.045;
      ctx.font = `${canvas.width * 0.025}px sans-serif`;
      const scoreIds = Object.keys(scores).sort((a, b) => Number(a) - Number(b));
      for (const id of scoreIds) {
        const color = colors[id] || '#888';
        ctx.fillStyle = color;
        ctx.fillText(`${getPlayerName(id)}: ${scores[id]}`, cx, y);
        y += canvas.width * 0.035;
      }

      // Rematch button
      const btnW = canvas.width * 0.3;
      const btnH = canvas.width * 0.06;
      const btnX = cx - btnW / 2;
      const btnY = y + canvas.width * 0.02;
      rematchBtn = { x: btnX, y: btnY, w: btnW, h: btnH };

      const alreadyVoted = rematchVotes.includes(myId);

      ctx.fillStyle = alreadyVoted ? '#335533' : '#446644';
      ctx.strokeStyle = '#88bb88';
      ctx.lineWidth = 2;
      drawRoundedRect(btnX, btnY, btnW, btnH, 6);
      ctx.fill();
      ctx.stroke();

      ctx.font = `bold ${canvas.width * 0.025}px sans-serif`;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(alreadyVoted ? 'Voted!' : 'Rematch', cx, btnY + btnH / 2);

      if (rematchVotes.length > 0) {
        const voteY = btnY + btnH + canvas.width * 0.03;
        ctx.font = `${canvas.width * 0.02}px sans-serif`;
        ctx.fillStyle = '#aaaaaa';
        const voterNames = rematchVotes.map(id => getPlayerName(id)).join(', ');
        ctx.fillText(`Votes: ${voterNames}`, cx, voteY);
      }
    }

    // --- Render loop ---
    let lastRenderTime = performance.now();

    function render() {
      requestAnimationFrame(render);
      const now = performance.now();
      const dt = (now - lastRenderTime) / 1000;
      lastRenderTime = now;

      // Update screen shake timer
      if (shakeTimeLeft > 0) shakeTimeLeft -= dt;

      if (gamePhase === 'connect') {
        // HTML connect screen is visible, nothing to draw
      } else if (gamePhase === 'lobby') {
        drawLobby();
      } else if (gamePhase === 'playing') {
        const shake = getShakeOffset();
        ctx.save();
        ctx.translate(shake.x, shake.y);
        drawMap();
        gamePowerUps.forEach(pu => drawPowerUp(pu));
        gameLandmines.forEach(lm => drawLandmine(lm));
        gameIceTraps.forEach(it => drawIceTrap(it));
        drawWmPaths();
        updateAndDrawParticles(dt);
        const me = players.find(p => p.id === myId);
        drawPlayerIndicator(me);
        players.forEach(p => { if (p.alive) drawTank(p); });
        bullets.forEach(b => drawBullet(b));
        gameMissiles.forEach(m => drawMissile(m));
        gameWirelessMissiles.forEach(wm => drawWirelessMissile(wm));
        ctx.restore();
        drawHUD(); // HUD doesn't shake
      } else if (gamePhase === 'roundEnd') {
        drawMap();
        gamePowerUps.forEach(pu => drawPowerUp(pu));
        gameLandmines.forEach(lm => drawLandmine(lm));
        gameIceTraps.forEach(it => drawIceTrap(it));
        updateAndDrawParticles(dt);
        players.forEach(p => drawTank(p));
        bullets.forEach(b => drawBullet(b));
        gameMissiles.forEach(m => drawMissile(m));
        gameWirelessMissiles.forEach(wm => drawWirelessMissile(wm));
        drawHUD();
        drawScoreOverlay();
      }
    }
    render();
  </script>
</body>
</html>
