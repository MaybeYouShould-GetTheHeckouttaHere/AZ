<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AZ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    canvas { display: block; }
    #connectScreen {
      text-align: center;
      color: #ffffff;
    }
    #connectScreen h1 {
      font-size: 80px;
      margin-bottom: 30px;
    }
    #connectScreen input {
      font-size: 20px;
      padding: 10px 16px;
      border: 2px solid #555;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
      outline: none;
      width: 220px;
      text-align: center;
    }
    #connectScreen input:focus { border-color: #88bb88; }
    #connectScreen button {
      display: block;
      margin: 20px auto 0;
      font-size: 18px;
      padding: 10px 32px;
      border: 2px solid #88bb88;
      border-radius: 6px;
      background: #446644;
      color: #fff;
      cursor: pointer;
    }
    #connectScreen button:hover { background: #557755; }
    #connectScreen .status {
      margin-top: 16px;
      font-size: 14px;
      color: #888;
    }
    #connectScreen .error {
      margin-top: 10px;
      font-size: 14px;
      color: #cc5555;
    }
  </style>
</head>
<body>
  <div id="connectScreen">
    <h1>AZ</h1>
    <input id="nameInput" type="text" maxlength="16" placeholder="Username" autofocus>
    <button id="connectBtn">Connect</button>
    <div class="status" id="connectStatus"></div>
    <div class="error" id="connectError"></div>
  </div>
  <canvas id="game" style="display:none;"></canvas>
  <script type="module" src="client/main.js"></script>
</body>
</html>
